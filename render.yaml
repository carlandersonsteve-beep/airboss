services:
  - type: web
    name: groundcore
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_SECRET
        generateValue: true
      - key: CHECKIN_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_SSL_MODE
        value: require
      - key: TRUST_PROXY
        value: "1"
      - key: CHECKIN_RATE_LIMIT_WINDOW_MS
        value: "600000"
      - key: CHECKIN_SESSION_RATE_LIMIT
        value: "60"
      - key: CHECKIN_LOOKUP_RATE_LIMIT
        value: "30"
      - key: CHECKIN_WRITE_RATE_LIMIT
        value: "40"
