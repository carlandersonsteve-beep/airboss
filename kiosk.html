<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GroundCore Kiosk">
    <meta name="theme-color" content="#8b1e2d">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/assets/icon-192.svg" type="image/svg+xml">
    <title>GroundCore - Customer Check-In</title>
    <link rel="stylesheet" href="/css/tailwind.generated.css?v=20260519a">
    <script src="/js/vendor/react.production.min.js"></script>
    <script src="/js/vendor/react-dom.production.min.js"></script>
    <style>
        
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #3a2a1d;
            background-image:
                linear-gradient(rgba(27, 17, 10, 0.34), rgba(27, 17, 10, 0.34)),
                radial-gradient(circle at top, rgba(201, 169, 97, 0.16), transparent 40%),
                url('/assets/kiosk-wood-bg.jpg?v=20260804a');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.15);
            pointer-events: none;
            z-index: 0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #root {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        .mustang-logo {
            background: linear-gradient(135deg, #C41E3A 0%, #8B1528 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 3px solid #8b7355;
        }
        .glass-card img {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .glass-card h1 {
            font-family: 'American Typewriter', 'Book Antiqua', Georgia, serif !important;
            font-weight: 800 !important;
            letter-spacing: 2px !important;
            text-shadow: 0 2px 0 rgba(201, 169, 97, 0.35);
        }
        .btn {
            padding: 1rem 2.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            border: none;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #C41E3A 0%, #8B1528 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(196, 30, 58, 0.3);
        }
        .btn-secondary {
            background: #c9a961;
            color: #333;
        }
        .btn-secondary:hover {
            background: #b89951;
        }
        .input-field {
            width: 100%;
            padding: 0.875rem;
            font-size: 1.125rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            margin-top: 0.5rem;
        }
        .input-field:focus {
            outline: none;
            border-color: #C41E3A;
        }
        .service-option {
            display: flex;
            align-items: center;
            padding: 1rem;
            background: #f9fafb;
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .service-option:hover {
            background: #f3f4f6;
        }
        .service-option.selected {
            border-color: #C41E3A;
            background: #fef2f2;
        }
        .service-option input[type="checkbox"] {
            width: 1.5rem;
            height: 1.5rem;
            margin-right: 1rem;
            cursor: pointer;
        }
        .progress-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        .progress-step {
            flex: 1;
            height: 0.5rem;
            background: #e5e7eb;
            border-radius: 0.25rem;
        }
        .progress-step.active {
            background: #C41E3A;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="src/app/browserRuntime.js?v=20260322f"></script>
        <script src="/js/build/kiosk.app.js?v=20260519a"></script>
</body>
</html>
